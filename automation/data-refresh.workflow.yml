name: Refresh government source index

on:
  schedule:
    - cron: "23 6 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Python crawler dependencies
        run: python -m pip install -r pipeline/requirements.txt
      - name: Crawl and populate SQLite
        run: python -m pipeline.run --source all
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          GOVGUIDE_CRAWL_LIMIT: 40
          GOVGUIDE_USER_AGENT: GovGuide/1.0 (scheduled source review)
      - name: Check curated sources
        run: npm run check:sources
      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "data: refresh government source index"
          branch: automation/source-refresh
          delete-branch: true
          title: "Review government source refresh"
          body: "Automated Python crawl and SQLite refresh. Machine-indexed records are already stored in SQL; review status controls whether they can support public guidance."
